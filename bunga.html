<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bunga Tunggal dan Bunga Majemuk</title>
<!-- KaTeX 0.16.45 (dipatok, SRI) untuk merender rumus. Bila gagal dimuat, teks biasa tetap tampil. -->
<link rel="stylesheet" id="katexCss" media="print" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.45/katex.min.css" integrity="sha384-UA8juhPf75SzzAMA/4fo3yOU7sBJ0om7SCD2GHq0fZqZco6tr1UCV7nUbk9J90JM" crossorigin="anonymous" referrerpolicy="no-referrer">
<script defer id="katexJs" src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.45/katex.min.js" integrity="sha384-Tt7wBxLKwSzFVRET4O4U9H6v8MNaQ/CjN2FMP4xFm0ErrFu6aNqoonRVW5W40iGI" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
:root{--ink:#1b2a41;--mut:#5b6b82;--bg:#eef3fb;--card:#fff;--blue:#1d4ed8;--green:#15803d;--red:#b91c1c;--amber:#b45309;--line:#d5deee;--orange:#c2410c}
*{box-sizing:border-box}
body{margin:0;font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding:14px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
header h1{font-size:clamp(1.15rem,4.2vw,1.7rem);margin:0;line-height:1.25}
header p{margin:0;color:var(--mut);font-size:.9rem}
.tabs{display:flex;gap:6px;background:#dde6f5;padding:4px;border-radius:12px}
.tab{border:0;background:transparent;font:inherit;font-weight:600;padding:9px 14px;border-radius:9px;color:var(--mut);cursor:pointer;min-height:44px}
.tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.prob{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.prob>div:first-child{flex:1;min-width:0}
.prob small{color:var(--mut);display:block}
.prob-actions{display:flex;gap:8px;flex-wrap:wrap}
.ask{margin:4px 0 6px;font-size:1rem}
.qask{font-weight:700;color:var(--blue)}
.pdata{margin-top:8px}
ol.prog{list-style:none;display:flex;gap:4px;padding:0;margin:0 0 8px}
ol.prog li{flex:1;text-align:center;font-size:.78rem;color:var(--mut)}
ol.prog li span{display:grid;place-items:center;width:32px;height:32px;margin:0 auto 2px;border-radius:50%;background:#e4ebf7;font-weight:700;color:var(--mut)}
ol.prog li.cur span{background:var(--blue);color:#fff}
ol.prog li.cur{color:var(--blue);font-weight:700}
ol.prog li.done span{background:var(--green);color:#fff}
ol.prog li.miss span{background:var(--amber);color:#fff}
ol.prog em{font-style:normal;display:block}
#stepText{margin:0;font-size:.9rem;color:var(--mut);text-align:center}
.layout{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:860px){.layout{grid-template-columns:minmax(340px,1fr) minmax(320px,440px);align-items:start}.side{position:sticky;top:10px}}
h2{font-size:1.2rem;margin:0 0 8px}
.side h3{font-size:1rem;margin:4px 0 6px}
.muted{color:var(--mut);font-size:.95rem}
.eq{display:inline-block;background:#eaf0ff;border-radius:8px;padding:0 8px;font-weight:700}
.note{background:#f6f9ff;border-left:4px solid var(--blue);padding:8px 12px;border-radius:8px;margin:10px 0}
.note p{margin:.3em 0}
.rule{background:#fff8e6;border:1px solid #f3dca0;border-radius:10px;padding:8px 12px;margin:10px 0;font-size:.97rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{font:inherit;font-weight:600;border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer;color:var(--ink)}
.chip.on{border-color:var(--blue);background:#eaf0ff;color:var(--blue)}
.chip:disabled{opacity:.45;cursor:default}
.btn{font:inherit;font-weight:700;border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:12px;padding:10px 18px;min-height:48px;cursor:pointer}
.btn.primary{background:var(--blue);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn:disabled,.segb:disabled{opacity:.55;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
input.num{font:inherit;font-size:1.15rem;padding:8px 10px;border:2px solid var(--line);border-radius:10px;min-height:46px;width:min(100%,230px);background:#fff;color:var(--ink)}
input.num:focus{outline:none;border-color:var(--blue)}
input.num.ok{border-color:var(--green);background:#ecfdf3}
input.num.bad{border-color:var(--red);background:#fef2f2}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.seg.col{flex-direction:column;align-items:stretch}
.segb{font:inherit;font-weight:600;display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;min-height:48px;cursor:pointer;color:var(--ink);text-align:left}
.segb.on{border-color:var(--blue);background:#eaf0ff;color:var(--blue)}
.segb .bx{flex:none;width:22px;height:22px;border:2px solid currentColor;border-radius:6px;display:grid;place-items:center;font-size:.9rem;line-height:1}
.segb.rad .bx{border-radius:50%}
.hints{margin:10px 0 0;padding:8px 12px 8px 30px;background:#fff8e6;border:1px solid #f3dca0;border-radius:10px;font-size:.97rem}
.hints[hidden],.fb[hidden]{display:none}
.hints li{margin:.25em 0}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-weight:500}
.fb.ok{background:#ecfdf3;border:1px solid #9be0b8;color:#14532d}
.fb.bad{background:#fef2f2;border:1px solid #f3b4b4;color:#7f1d1d}
.fb.info{background:#eff6ff;border:1px solid #b6d0fb;color:#1e3a8a}
.fb p{margin:.3em 0}
.okc{color:var(--green)}.badc{color:var(--red)}
ol.sum{padding-left:22px}
ol.sum li{margin:.5em 0}
.score{font-size:3rem;font-weight:800;color:var(--blue)}
.score small{font-size:1.2rem;color:var(--mut)}
.over #problemCard,.over #progressBox{display:none}
.noside .side{display:none}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.mini span{font-size:.78rem;padding:3px 10px;border-radius:999px;background:#e4ebf7;color:var(--mut);font-weight:600}
.mini span.cur{background:var(--blue);color:#fff}
.mini span.dn{background:#dcf5e6;color:#14532d}
.mini span.ms{background:#fdecc8;color:#7c2d12}
.lvl{margin:10px 0}
.trow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.trow.ok{background:#ecfdf3;border-color:#9be0b8}
.trow.bad{background:#fef2f2;border-color:#f3b4b4}
.trow p{margin:.3em 0}
.trow .flb{font-weight:700;margin:0 0 4px}
.inrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pre,.suf{font-weight:700;color:var(--mut)}
.pv{display:block;color:var(--mut);font-size:.82rem;margin-top:3px;min-height:1.1em}
table.dt{border-collapse:collapse;width:100%;font-size:.95rem;margin:6px 0}
.dt th,.dt td{border:1px solid var(--line);padding:5px 8px;text-align:right;white-space:nowrap}
.dt th{background:#eaf0ff;text-align:center}
.dt td:first-child{text-align:center}
.dtwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.dtcap{margin:4px 0 0;font-weight:700;font-size:.92rem}
.mini-chart{width:100%;max-width:420px;height:auto;display:block;background:#fff;margin:6px 0}
.ax{font:11px system-ui,sans-serif;fill:#44546a}
.found{list-style:none;padding:0;margin:4px 0}
.found li{padding:5px 8px;border-radius:8px;margin:4px 0;background:#f6f9ff;font-size:.93rem}
.found li.ms{background:#fff7e8}
details.rumus{border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin-top:10px}
details.rumus summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
details.rumus p{margin:.35em 0}
.chart svg{width:100%;height:auto;display:block;background:#fff;border-radius:10px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.88rem;font-weight:700;margin:4px 0}
.lgT{color:var(--blue)}.lgM{color:var(--orange)}
.sl{display:grid;grid-template-columns:2.4em 1fr 7.2em;gap:8px;align-items:center;margin:2px 0}
.sl label{font-weight:700}
.sl input[type=range]{width:100%;min-height:44px;accent-color:var(--blue)}
.sl output{font-weight:700;text-align:right;font-size:.92rem}
.timer{font-weight:700;color:var(--blue)}
.timer.low{color:var(--red)}
.refl{background:#f5f3ff;border:1px solid #d9d2fb;border-radius:12px;padding:8px 12px;margin:10px 0}
.refl p{margin:.3em 0}
@media(min-width:860px){.pdata{display:none}}
@media(max-width:859px){.sdata{display:none}}

/* ===== Maskot Plus ===== */
:root{--plus-w:90px}
@media(min-width:860px){:root{--plus-w:120px}}
body:not(.plus-off) .wrap{padding-bottom:calc(var(--plus-w)*.93 + 36px)}
#plusWrap{position:fixed;right:8px;bottom:8px;z-index:50;display:flex;align-items:flex-end;gap:4px;pointer-events:none}
body.plus-off #plusWrap{display:none}
#plusBody{position:relative;width:var(--plus-w);flex:none}
#plusBody svg{width:100%;height:auto;display:block;overflow:visible}
#plusBubble{align-self:center;position:relative;max-width:min(190px,52vw);background:#fff;color:var(--ink);border:2px solid var(--blue);border-radius:14px;padding:7px 11px;font-weight:700;font-size:.86rem;line-height:1.3;box-shadow:0 2px 8px rgba(29,78,216,.18);opacity:0;visibility:hidden;transform:translateX(8px) scale(.92);transform-origin:right center;transition:opacity .25s,transform .25s,visibility 0s .25s}
#plusBubble.show{opacity:1;visibility:visible;transform:none;transition-delay:0s}
#plusBubble::after{content:"";position:absolute;right:-8px;top:50%;width:12px;height:12px;background:#fff;border-right:2px solid var(--blue);border-top:2px solid var(--blue);transform:translateY(-50%) rotate(45deg)}
@media(min-width:860px){#plusBubble{max-width:240px;font-size:.95rem}}
#plusToggle{position:fixed;z-index:51;right:8px;bottom:calc(var(--plus-w)*.93 + 12px);width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;color:var(--mut);font:700 14px/1 system-ui,sans-serif;cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.18)}
body.plus-off #plusToggle{bottom:8px;width:auto;height:44px;border-radius:999px;padding:0 16px;border-color:var(--blue);color:var(--blue);font-size:.95rem}
#plusWrap .eyeH,#plusWrap .mH,#plusWrap .mS,#plusWrap .brow{display:none}
#plusWrap[data-mood=happy] .eye,#plusWrap[data-mood=happy] .mN,#plusWrap[data-mood=happy] .mS{display:none}
#plusWrap[data-mood=happy] .eyeH,#plusWrap[data-mood=happy] .mH{display:inline}
#plusWrap[data-mood=sad] .mN{display:none}
#plusWrap[data-mood=sad] .mS,#plusWrap[data-mood=sad] .brow{display:inline}
#plusChar{transform-origin:70px 72px;animation:plusFloat 3.2s ease-in-out infinite}
#armL{transform-origin:30px 64px}
#armR{transform-origin:110px 64px}
.eye{transform-box:fill-box;transform-origin:center;animation:plusBlink 4.8s infinite}
#plusWrap[data-act=wave] #armR{animation:plusWave 2.2s ease-in-out 1}
#plusWrap[data-act=cheer] #plusChar{animation:plusJump 1s ease-out 1}
#plusWrap[data-act=cheer] #armL{animation:plusUpL 1.4s ease-in-out 1}
#plusWrap[data-act=cheer] #armR{animation:plusUpR 1.4s ease-in-out 1}
#plusWrap[data-act=shake] #plusChar{animation:plusShake 1.1s ease-in-out 1}
#plusWrap[data-act=point] #armL{animation:plusPoint 1.8s ease-in-out 1}
#plusWrap[data-act=spin] #plusChar{animation:plusSpin 1.1s ease-in-out 1}
#plusWrap[data-act=spin] #armL{animation:plusUpL 1.6s ease-in-out 1}
#plusWrap[data-act=spin] #armR{animation:plusUpR 1.6s ease-in-out 1}
@keyframes plusFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes plusBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes plusWave{0%{transform:rotate(0)}15%{transform:rotate(-100deg)}30%{transform:rotate(-124deg)}45%{transform:rotate(-96deg)}60%{transform:rotate(-124deg)}75%{transform:rotate(-96deg)}90%{transform:rotate(-100deg)}100%{transform:rotate(0)}}
@keyframes plusUpL{0%{transform:rotate(0)}20%,80%{transform:rotate(105deg)}100%{transform:rotate(0)}}
@keyframes plusUpR{0%{transform:rotate(0)}20%,80%{transform:rotate(-105deg)}100%{transform:rotate(0)}}
@keyframes plusPoint{0%{transform:rotate(0)}20%{transform:rotate(75deg)}35%{transform:rotate(66deg)}50%{transform:rotate(78deg)}65%{transform:rotate(66deg)}85%{transform:rotate(75deg)}100%{transform:rotate(0)}}
@keyframes plusJump{0%,100%{transform:translateY(0)}25%{transform:translateY(-22px)}50%{transform:translateY(0)}65%{transform:translateY(-9px)}80%{transform:translateY(0)}}
@keyframes plusShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}
@keyframes plusSpin{0%{transform:translateY(0) rotate(0)}45%{transform:translateY(-16px) rotate(360deg)}100%{transform:translateY(0) rotate(360deg)}}
#plusConf{position:absolute;left:50%;top:45%;width:0;height:0;pointer-events:none}
#plusConf i{position:absolute;width:7px;height:10px;border-radius:2px;animation:plusConf 1.5s ease-out forwards}
@keyframes plusConf{0%{transform:translate(0,0) rotate(0);opacity:1}60%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 50px)) rotate(var(--rot));opacity:0}}
@media (prefers-reduced-motion:reduce){
  #plusChar,#armL,#armR,.eye,#plusConf i{animation:none!important}
  #plusBubble{transition:none!important}
  #plusWrap[data-act=wave] #armR,#plusWrap[data-act=cheer] #armR,#plusWrap[data-act=spin] #armR{transform:rotate(-105deg)}
  #plusWrap[data-act=cheer] #armL,#plusWrap[data-act=spin] #armL{transform:rotate(105deg)}
  #plusWrap[data-act=point] #armL{transform:rotate(75deg)}
}
#plusFx{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:49;pointer-events:none;overflow:visible}
#plusFx .ring{fill:rgba(245,158,11,.14);stroke:#f59e0b;stroke-width:4;animation:fxPulse 1.4s ease-in-out infinite}
@keyframes fxPulse{50%{stroke-opacity:.45}}
#plusFx .beam{stroke:#f59e0b;stroke-width:3;stroke-dasharray:7 6;fill:none;marker-end:url(#fxArr)}
#plusWrap.go{transition:transform .65s cubic-bezier(.4,0,.2,1)}
#plusWrap[data-side=r]{flex-direction:row-reverse}
#plusWrap[data-side=r] #plusBubble{transform-origin:left center}
#plusWrap[data-side=r] #plusBubble::after{right:auto;left:-8px;border-right:0;border-top:0;border-left:2px solid var(--blue);border-bottom:2px solid var(--blue)}
@media(prefers-reduced-motion:reduce){#plusWrap.go{transition:none!important}#plusFx .ring{animation:none}}

/* ===== Tampilan ringkas PC/laptop: satu layar, tanpa scroll halaman ===== */
@media (min-width:860px) and (min-height:500px){
  body{--sw:clamp(330px,36vw,470px)}
  html,body{height:100%}
  body{overflow:hidden;font-size:15px;line-height:1.45}
  body .wrap,body:not(.plus-off) .wrap{height:100vh;max-width:1320px;padding:8px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto auto minmax(0,1fr);column-gap:12px}
  header{grid-column:1/3;margin:0 0 6px;gap:6px}
  header>div{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  header h1{font-size:1.15rem}
  header p{font-size:.82rem}
  .tabs{padding:3px}
  .card{padding:10px 14px;margin-bottom:8px;border-radius:12px}
  #problemCard{grid-column:1;grid-row:2}
  #progressBox{grid-column:1;grid-row:3}
  .layout{display:contents}
  #panel{grid-column:1;grid-row:4;overflow:auto;min-height:0;margin-bottom:0}
  .side{grid-column:2;grid-row:2/5;align-self:stretch;position:static;margin:0;width:var(--sw);overflow:auto;min-height:0}
  body:not(.plus-off) .side{margin-bottom:calc(var(--plus-w)*.93 + 20px)}
  .prob{flex-wrap:nowrap;gap:12px;align-items:center}
  .prob-actions{flex-direction:column;gap:4px}
  #progressBox{padding:6px 10px}
  ol.prog{margin:0}
  ol.prog li{font-size:.72rem}
  ol.prog li span{width:26px;height:26px;font-size:.78rem}
  #stepText{display:none}
  #panel h2{font-size:1.05rem;margin:0 0 4px}
  #panel p{margin:.35em 0}
  .row{margin-top:8px}
  .note{margin:6px 0;padding:4px 10px}
  .rule{margin:6px 0;padding:5px 10px;font-size:.9rem}
  .chips{margin:4px 0;gap:6px}
  .lvl{margin:4px 0;display:flex;align-items:center;gap:10px}
  .lvl>b{flex:0 0 110px}
  .lvl .chips{margin:0}
  .mini{margin:0 0 6px}
  .hints{margin:6px 0 0;padding:5px 10px 5px 26px;font-size:.9rem}
  .fb{margin-top:6px;padding:7px 10px}
  .trow{padding:6px 10px;margin:6px 0}
  .seg{margin:6px 0}
  .score{font-size:2.4rem}
  ol.sum li{margin:.3em 0}
}
@media (min-width:860px) and (max-height:720px){:root{--plus-w:100px}}
.form{display:grid;gap:10px;margin:12px 0}
.form label{display:block;font-weight:600}
.form label small{font-weight:400;color:var(--mut)}
.form input{display:block;width:100%;font:inherit;font-size:1.1rem;padding:10px 12px;border:2px solid var(--line);border-radius:10px;min-height:46px;margin-top:4px;background:#fff;color:var(--ink)}
.form input:focus{outline:none;border-color:var(--blue)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.form .two{grid-template-columns:1fr}}

/* ===== Tab Belajar dan penunjuk Plus ===== */
.exhd{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:4px}
.exhd select{font:inherit;font-size:.95rem;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);max-width:100%;min-height:44px}
.exsrc{display:block;color:var(--mut);font-size:.8rem;margin-top:6px}
.exl{margin:6px 0;padding-left:22px}
.exl li{margin:4px 0;padding:3px 6px;border-radius:8px}
.hit{background:#fff3c4;outline:2px solid #f59e0b;outline-offset:1px;border-radius:8px}
.ans{margin:8px 0;padding:8px 12px;border-radius:10px;background:#e8f1fb;font-weight:700}
.sols{display:grid;gap:6px;margin:8px 0}
.sol{display:block;width:100%;text-align:left;font:inherit;font-size:.95rem;padding:7px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer;min-height:44px}
.sol:hover{border-color:var(--blue)}
.sol.ok{border-color:#a7dcb8;background:#f2fbf5}
.sol.bad{border-color:var(--red);background:#fee2e2}
.exbox{margin:8px 0;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#f8fafc}
.exbox.why{border-color:#f3b5b5;background:#fff1f1}
.exbox.fix{border-color:#a7dcb8;background:#effaf2}
table.ext{width:100%;border-collapse:collapse;font-size:.93rem;margin:6px 0}
table.ext th,table.ext td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.ext th{background:#e8f0fb}
#panel p.eq{display:block;width:fit-content;max-width:100%;margin:6px 0;overflow-x:auto}
.whereBox{margin-top:6px}
#whereTxt{display:block;margin-top:4px;font-weight:600}

/* ===== Tab Belajar: tombol Sebelumnya / Berikutnya / Ulangi melayang di perangkat kecil ===== */
#exFloat{display:contents}
#exFloat .exfpos{display:none}
@media not all and (min-width:860px) and (min-height:500px){
  .exempty{margin:0;padding:0;height:0;min-height:0;border:0}
  body.ex-bar:not(.plus-off) .wrap{padding-bottom:calc(var(--plus-w)*.93 + 36px + var(--exbar-h,0px))}
  body.ex-bar.plus-off .wrap{padding-bottom:calc(64px + var(--exbar-h,0px))}
  body.ex-bar #plusWrap{bottom:calc(8px + var(--exbar-h,0px))}

function judgeField(f,a){
  if(f.ty==='opt')return a===f.k;
  if(f.ty==='chk'){
    if(!Array.isArray(a)||a.length!==f.k.length)return false;
    var s=a.slice().sort(),q=f.k.slice().sort();
    for(var i=0;i<s.length;i++)if(s[i]!==q[i])return false;
    return true;
  }
  return isNum(a)&&Math.abs(a-f.k)<=f.t+1e-9*Math.max(1,Math.abs(f.k));
}
function misOf(f,a){
  if(f.ty==='opt')return isInt(a)&&f.mo[a]?f.mo[a]:'';
  if(!isNum(a)||!f.mis)return '';
  for(var i=0;i<f.mis.length;i++){
    var m=f.mis[i],t=m[2]!=null?m[2]:f.t;
    if(m[1]&&Math.abs(a-m[0])<=t+1e-9*Math.max(1,Math.abs(m[0])))return m[1];
  }
  return '';
}
function validAns(f,a){
  if(f.ty==='opt')return isInt(a)&&a>=0&&a<f.o.length;
  if(f.ty==='chk'){
    if(!Array.isArray(a)||a.length>f.o.length)return false;
    for(var i=0;i<a.length;i++){if(!isInt(a[i])||a[i]<0||a[i]>=f.o.length||a.indexOf(a[i])!==i)return false;}
    return true;
  }
  return isNum(a)&&Math.abs(a)<1e13;
}

  var ok=[],first=-1;
  st.f.forEach(function(f,k){var o=!!(locked&&locked[k])||judgeField(f,ans[k]);ok.push(o);if(!o&&first<0)first=k;});
  return {ok:ok,all:first<0,first:first};
}
function keyAns(st){return st.f.map(function(f){return f.ty==='chk'?f.k.slice():f.k;});}

/* ---------- paket kuis: 8 soal, urut mudah → sulit ---------- */
var SLOT=[['T1','T2','T3'],['K1','K2','K3'],['T4','T5','T6','T7','T8'],['K4','K5','K6','K7','K8','K9'],['T9','T10'],['K10','K11','K12']];
function buildPack(seed){
  var rng=mulberry32(seed),ids=SLOT.map(function(s){return pick(rng,s);}),g=shuffle(['G2','G3','G4'],rng).slice(0,2).sort();
  ids=ids.concat(g);
  return {seed:seed,ids:ids,set:ids.map(function(id){return GEN[id](rng);})};
}
var MAKS_LEWAT=2;   /* langkah boleh dilewati (bernilai 0) setelah sekian jawaban salah */

/* ---------- penilai jejak jawaban ----------
   jejak = daftar peristiwa {p,s,a,t}: p = nomor soal, s = nomor langkah, a = daftar jawaban mentah
   per kotak (angka, indeks pilihan, atau daftar indeks) atau 'LEWAT', t = waktu (ms sejak mulai).
   Nilai = rata-rata proporsi langkah yang benar pada percobaan pertama per soal, skala 0–100. */
function gradeTrace(pack,trace){
  var order=[];
  pack.set.forEach(function(q,p){q.steps.forEach(function(_,s){order.push({p:p,s:s});});});
  var ev=Array.isArray(trace)?trace:[],c=0,wc=0,lk=null,ignored=0,missed={},steps=[],lastT=0,monotonic=true;
  var okP=pack.set.map(function(){return 0;}),nP=pack.set.map(function(q){return q.steps.length;}),benar=0;
  function done(ok){
    var d=order[c],st=pack.set[d.p].steps[d.s];
    steps.push({p:d.p,s:d.s,ok:ok});
    if(ok){okP[d.p]++;benar++;}else missed[st.cat]=(missed[st.cat]||0)+1;
    c++;wc=0;lk=null;
  }
  for(var k=0;k<ev.length;k++){
    var e=ev[k];
    if(!e||typeof e!=='object'){ignored++;continue;}
    if(isNum(e.t)){if(e.t<lastT)monotonic=false;else lastT=e.t;}
    var d=order[c];
    if(!d||e.p!==d.p||e.s!==d.s){ignored++;continue;}
    var st=pack.set[d.p].steps[d.s];
    if(e.a==='LEWAT'){if(wc>=MAKS_LEWAT)done(false);else ignored++;continue;}
    if(!Array.isArray(e.a)||e.a.length!==st.f.length){ignored++;continue;}
    var bad=false;for(var j=0;j<st.f.length;j++)if(!validAns(st.f[j],e.a[j]))bad=true;
    if(bad){ignored++;continue;}
    var r=judgeStep(st,e.a,lk);lk=r.ok;
    if(r.all)done(wc===0);else wc++;
  }
  var tot=0;okP.forEach(function(o,i){tot+=o/nP[i];});
  var score=pack.set.length?Math.round(100*tot/pack.set.length):0;
  return {score:score,max:100,benar:benar,langkah:order.length,done:c,complete:c===order.length,ignored:ignored,missed:missed,steps:steps,monotonic:monotonic,lastT:lastT};
}

/* ---------- sidik jari kode: halaman dan server harus menghasilkan nilai yang sama ---------- */
function djb2(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(16);}
function wrongAns(st){return st.f.map(function(f){
  if(f.ty==='opt')return (f.k+1)%f.o.length;
  if(f.ty==='chk')return f.k.length===f.o.length?[]:f.o.map(function(_,i){return i;});
  return f.k*2+12345;});}
function cek(){
  var pk=buildPack(20261029),sm=[],t=0;
  function add(p,s,a){sm.push({p:p,s:s,a:a,t:++t});}
  pk.set.forEach(function(q,p){q.steps.forEach(function(st,s){
    var m=(p+s)%3;
    if(m===0){add(p,s,wrongAns(st));add(p,s,wrongAns(st));add(p,s,'LEWAT');}
    else if(m===1){add(p,s,wrongAns(st));add(p,s,keyAns(st));}
    else add(p,s,keyAns(st));
  });});
  add(9,9,'zz');
  var all=KRIT.map(function(r,i){return GEN[r[0]](mulberry32(7000+i));});
  return VERSI+':'+djb2(JSON.stringify({pk:pk,g:gradeTrace(pk,sm),all:all,mis:MIS}));
}

return {VERSI:VERSI,KRIT:KRIT,GEN:GEN,MIS:MIS,CAT:CAT,SLOT:SLOT,MAKS_LEWAT:MAKS_LEWAT,mulberry32:mulberry32,powi:powi,
  fNum:fNum,fRp:fRp,fPct:fPct,fD:fD,TX:TX,RM:RM,judgeField:judgeField,misOf:misOf,validAns:validAns,judgeStep:judgeStep,

/* ---------- membaca angka format Indonesia ----------
   rupiah/bilangan bulat: titik = pemisah ribuan, koma = desimal (1.250.000 atau 1250000).
   desimal/persen: koma atau titik sebagai tanda desimal (0,06 atau 0.06); pecahan a/b juga boleh untuk desimal. */
function parseIn(s,ty){
  s=String(s==null?'':s).replace(/\s+/g,'').replace(/^rp\.?/i,'').replace(/%$/,'').replace(/−/g,'-');
  if(!s)return null;
  if(s.indexOf('/')>=0){
    if(ty!=='dec')return NaN;
    var pr=s.split('/');if(pr.length!==2)return NaN;
    var a=parseIn(pr[0],'dec'),b=parseIn(pr[1],'dec');
    return (typeof a==='number'&&isFinite(a)&&typeof b==='number'&&isFinite(b)&&b!==0)?a/b:NaN;
  }
  if(ty==='rp'||ty==='int'){s=s.indexOf(',')>=0?s.replace(/\./g,'').replace(',','.'):s.replace(/\./g,'');}
  else if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
  if(!/^-?\d+(\.\d+)?$/.test(s))return NaN;
  var v=Number(s);
  if(ty==='int'&&Math.floor(v)!==v)return NaN;
  return v;
}
function preview(v,ty){
  if(v===null)return '';
  if(typeof v!=='number'||!isFinite(v))return '⚠ format belum terbaca';
  if(ty==='rp')return 'terbaca: '+fRp(v)+(Math.round(v)!==v?' (dibulatkan)':'');
  if(ty==='pct')return 'terbaca: '+fNum(v,4,true)+'%';
  if(ty==='int')return 'terbaca: '+fNum(v,0);
  return 'terbaca: '+fNum(v,6,true);
}

  return fetch(CONFIG.ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(obj),signal:ctl?ctl.signal:undefined})
    .then(function(r){if(tm)clearTimeout(tm);return r.json();});
}
function netMsg(err){return err&&err.name==='AbortError'?'Server tidak merespons (waktu habis). Coba lagi.':'Tidak dapat terhubung ke server. Periksa internet, lalu coba lagi.';}

var AUTO_JEDA=[4000,8000];
var sendSeq=0;
function sendBody(body,n){
  var id=++sendSeq;n=n||0;
  var stale=function(){return id!==sendSeq;};
  var show=function(x){st.send=x;if(st.over)renderPanel();};
  var fail=function(msg,retry){
    if(stale())return;
    if(retry&&n<AUTO_JEDA.length){
      show({state:'sending',n:n+1,wait:true});
      setTimeout(function(){if(!stale())sendBody(body,n+1);},AUTO_JEDA[n]);
      return;
    }
    show({state:'err',msg:msg,retry:retry});
  };
  show({state:'sending',n:n});
  callServer(body).then(function(res){
    if(res&&res.ok){clearPending();if(!stale())show({state:'ok',res:res});}
    else{var f=fatalCode(res);if(f)clearPending();fail((res&&res.pesan)||'Server menolak nilai.',!f);}
  }).catch(function(err){fail(netMsg(err),true);});
}

  var p=loadPending();if(!p)return;
  lgMsg('info','⏳ Mengirim nilai tertunda…');

    else{if(fatalCode(res))clearPending();lgMsg('bad',esc((res&&res.pesan)||'Gagal mengirim.'));}
  }).catch(function(err){lgMsg('bad',netMsg(err));});

function skipBtn(){
  if(st.wc<CORE.MAKS_LEWAT)return '';
  return st.mode==='learn'?'<button class="btn ghost" id="bSkip">👀 Tunjukkan jawaban</button>':'<button class="btn ghost" id="bSkip">Lewati langkah (0 poin)</button>';
}
function readAns(){
  var s=cur(),out=[],bad=-1;
  s.f.forEach(function(f,k){
    var v=st.vals[k],a;
    if(f.ty==='opt'){a=(typeof v==='number')?v:null;if(a===null&&bad<0)bad=k;}
    else if(f.ty==='chk'){a=Array.isArray(v)?v.slice():[];if(!a.length&&bad<0)bad=k;}
    else{a=parseIn(v,f.ty);if((a===null||!isFinite(a))&&bad<0)bad=k;}
    out.push(a);
  });
  return {a:out,bad:bad};
}
function checkStep(){
  var s=cur(),r=readAns();
  if(r.bad>=0){
    var f=s.f[r.bad];
    fb('info',f.ty==='opt'||f.ty==='chk'?'Pilih jawaban pada bagian “'+f.lb+'” terlebih dahulu.':'Isi “'+f.lb+'” dengan angka yang formatnya benar, misalnya 1.250.000 atau 0,06.');
    var e=$('#in'+r.bad);if(e)e.focus();return;
  }
  rec(r.a);
  var j=CORE.judgeStep(s,r.a,st.lk);st.lk=j.ok;
  s.f.forEach(function(f,k){
    var row=$('#fld'+k),inp=$('#in'+k);
    if(j.ok[k]){row.classList.add('ok');row.classList.remove('bad');if(inp){inp.disabled=true;inp.classList.add('ok');inp.classList.remove('bad');}row.querySelectorAll('.segb').forEach(function(b){b.disabled=true;});}
    else{row.classList.add('bad');if(inp)inp.classList.add('bad');}
  });
  if(j.all){stepDone(st.wc===0,false);return;}
  st.wc++;
  var k=j.first,f=s.f[k],mis=CORE.misOf(f,r.a[k]);
  st.lw={k:k,mis:mis};
  if(st.mode==='learn'){
    var msg=mis?CORE.MIS[mis]:(s.f.length>1?'Bagian “'+f.lb+'” belum tepat (yang benar sudah terkunci). ':'Jawabanmu belum tepat. ')+(mis?'':'Baca petunjuk, lalu coba lagi.');
    fb('bad',msg);
    if(st.hints<2)st.hints++;renderHints();
    whereBtn();
  }else fb('bad','Belum tepat, coba lagi.'+(st.wc>=CORE.MAKS_LEWAT?' Kamu juga boleh melewati langkah ini (bernilai 0).':''));
  actions((st.mode==='learn'?'<button class="btn ghost" id="bHint">💡 Petunjuk</button>':'')+'<button class="btn primary" id="bCheck">Periksa</button>'+skipBtn());
  on('bHint',showHint);on('bCheck',checkStep);on('bSkip',skipStep);
  mascotSay('salah');
  if(st.mode==='practice')renderProblem();
}
function skipStep(){
  if(st.wc<CORE.MAKS_LEWAT)return;
  rec('LEWAT');
  var s=cur(),key=CORE.keyAns(s);
  s.f.forEach(function(f,k){
    var row=$('#fld'+k);row.classList.remove('bad');row.classList.add('ok');
    if(f.ty==='opt'||f.ty==='chk'){
      row.querySelectorAll('.segb').forEach(function(b){var jj=+b.dataset.j,sel=f.ty==='chk'?key[k].indexOf(jj)>=0:key[k]===jj;b.classList.toggle('on',sel);b.querySelector('.bx').textContent=sel?(f.ty==='chk'?'✓':'●'):'';b.disabled=true;});
    }else{var inp=$('#in'+k);if(inp){inp.value=f.ty==='rp'?fNum(f.k,0):f.ty==='int'?String(f.k):fNum(f.k,f.ty==='pct'?2:6,true);inp.disabled=true;inp.classList.remove('bad');inp.classList.add('ok');}}
  });
  stepDone(false,true);
}
function stepDone(first,skipped){
  var s=cur(),q=st.q,last=st.s>=q.steps.length-1;
  st.res[st.s]=first;
  var hh=$('#hints');if(hh)hh.hidden=true;
  fb(skipped?'info':'ok',(skipped?'Jawaban langkah ini: ':'Tepat! ')+s.ok);

  actions('<button class="btn primary" id="bNext">'+(last?'Lihat ringkasan ➜':'Langkah berikutnya ➜')+'</button>');
  on('bNext',function(){if(last){st.stage='done';st.hints=0;renderAll();}else setStep(st.s+1);});
  var bn=$('#bNext');if(bn)bn.focus({preventScroll:true});
  renderProblem();renderSide();renderProgress();
}

function mascotSay(kind,extra){
  if(!$('#plusWrap')||document.body.classList.contains('plus-off'))return;
  var learn=st.mode==='learn',msg,mood='normal',act='',ms=1500;
  if(kind==='benar'){msg=plusPick(PLUS.benar);mood='happy';act='cheer';ms=1500;}
  else if(kind==='salah'){msg=(learn&&Math.random()<.6)?plusGuide():plusPick(PLUS.salah);mood='sad';act='shake';ms=1200;}
  else if(kind==='petunjuk'){msg=plusPick(PLUS.petunjuk);act='point';ms=1900;}
  else if(kind==='selesai'){msg=plusPick(PLUS.selesai);mood='happy';act='spin';ms=1700;plusConfetti();}
  else if(kind==='skor'){
    if(extra>=70){msg='Luar biasa! Nilaimu tinggi!';mood='happy';act='spin';ms=1700;plusConfetti();}
    else{msg='Tidak apa-apa, ayo belajar lagi!';act='wave';ms=2300;}
  }else{msg=plusPick(st.mode!=='practice'?PLUS.sapaL:PLUS.sapaP);act='wave';ms=2300;}
  plusSay(msg);plusState(mood,act,ms);
}
window.mascotSay=mascotSay;
function setPlusOff(off,save){
  var t=$('#plusToggle');
  document.body.classList.toggle('plus-off',off);
  t.textContent=off?'👋 Plus':'✕';
  t.title=off?'Munculkan Plus':'Sembunyikan Plus';
  t.setAttribute('aria-label',off?'Munculkan Plus':'Sembunyikan Plus');
  if(off){var b=$('#plusBubble');if(b)b.classList.remove('show');}
  if(save){try{localStorage.setItem('plusOff',off?'1':'0');}catch(_){}}
}
$('#plusToggle').onclick=function(){
  var off=!document.body.classList.contains('plus-off');
  setPlusOff(off,true);
  if(!off)mascotSay('sapa');
};
try{setPlusOff(localStorage.getItem('plusOff')==='1',false);}catch(_){}

  if(ex.rev)h+='<div class="exbox why" id="exWhy"><b>Letak dan alasan kesalahan:</b> '+sc.why+'</div><div class="exbox fix" id="exFix" hidden><b>Perbaikan:</b> '+sc.fix+'</div>';
  else h+='<div class="row"><button class="btn ghost" id="exReveal" type="button">Tunjukkan kesalahannya</button></div>';
  return h;
}
var TEBAK=[['T','Bunga tunggal'],['M','Bunga majemuk'],['S','Sama saja']];
function explainPanel(el){
  var sc=EX[ex.i],h='',last=ex.i===EX.length-1;
  h+='<div class="exhd"><select id="exTopic" aria-label="Pilih topik">'+EX_TOPICS.map(function(t){return '<option value="'+t[0]+'"'+(t[0]===sc.t?' selected':'')+'>'+esc(t[1])+'</option>';}).join('')+'</select><small id="exPos"></small></div>';
  h+='<h2>'+esc(sc.jd)+'</h2>'+(sc.k?exCase(sc):sc.panel)+'<small class="exsrc">Sumber: '+esc(sc.src)+'</small>';
  h+='<div class="row'+(last?'':' exempty')+'" id="exNav"><div id="exFloat"><span class="exfpos" id="exFpos" aria-hidden="true"></span><button class="btn" id="exPrev" type="button">◀ Sebelumnya</button><button class="btn primary" id="exNext" type="button">Berikutnya ▶</button><button class="btn ghost" id="exAgain" type="button" aria-label="Ulangi">↺ <span class="lb">Ulangi</span></button></div>'+(last?'<button class="btn primary" id="exGo" type="button">Latihan Mandiri ➜</button>':'')+'</div>';
  el.innerHTML=h;
  var pm=$('#pemantik');

    pm.querySelectorAll('[data-tb]').forEach(function(b){b.onclick=function(){ex.tebak=b.dataset.tb;pm.querySelectorAll('[data-tb]').forEach(function(x){x.classList.toggle('on',x===b);});$('#tebakMsg').textContent='Tebakanmu dicatat. Kita cek jawabannya di bagian Perbandingan.';};});
    if(ex.tebak)$('#tebakMsg').textContent='Tebakanmu dicatat. Kita cek jawabannya di bagian Perbandingan.';}
  var tc=$('#tebakCek');
  if(tc)tc.textContent=ex.tebak?('Tebakanmu tadi: '+TEBAK.filter(function(t){return t[0]===ex.tebak;})[0][1]+(ex.tebak==='M'?'. Tepat! 🎉':'. Sekarang kamu tahu alasannya.')):'Kamu belum menebak di bagian Tujuan. Tidak apa-apa!';
  renderMath(el);
  on('exPrev',exPrev);on('exNext',exNext);on('exAgain',function(){ex.b=0;exBeat();});on('exReveal',function(){ex.rev=true;ex.b=0;exShow();});
  on('exGo',function(){setTab('learn');startLearn();});
  var tp=$('#exTopic');if(tp)tp.onchange=function(){exTopic(tp.value);};
  document.querySelectorAll('.sol').forEach(function(b){b.onclick=function(){exTap(parseInt(b.getAttribute('data-i'),10));};});
  pendNotice(el);
}
function exTopic(id){for(var i=0;i<EX.length;i++)if(EX[i].t===id){ex.i=i;ex.b=0;ex.rev=false;exShow();return;}}
function exTap(i){
  var sc=EX[ex.i];if(ex.rev)return;
  if(i===sc.err){ex.rev=true;ex.b=0;exShow();return;}
  ex.miss++;
  var b=$('#sol'+i);if(b)b.classList.add('ok');
  var msg='Baris ini tidak mengandung kesalahan. Coba periksa baris lain.'+(ex.miss>=2?' Atau tekan "Tunjukkan kesalahannya".':'');
  var m=$('#exMsg');if(m)m.textContent=msg;

}
function exShow(){
  var sc=EX[ex.i],af=document.activeElement&&document.activeElement.id;
  if(sc.ch){CH.M0=sc.ch.M0;CH.p=sc.ch.p;CH.n=sc.ch.n;}
  renderAll();
  exBeat();
  if(af&&/^ex(Prev|Next|Again)$/.test(af)){var fe=$('#'+af);if(fe&&!fe.disabled&&fe.focus)fe.focus({preventScroll:true});}
}
function exBeat(){
  var sc=EX[ex.i],bs=exBeats(sc),bt=bs[Math.min(ex.b,bs.length-1)];
  document.querySelectorAll('#panel .hit').forEach(function(e){e.classList.remove('hit');});
  var fx=$('#exFix');if(fx)fx.hidden=!(sc.k&&ex.rev&&ex.b>=bs.length-1);
  var pos=$('#exPos');if(pos)pos.textContent='Bagian '+(ex.i+1)+' dari '+EX.length+(bs.length>1?' · langkah '+(Math.min(ex.b,bs.length-1)+1)+'/'+bs.length:'');
  var fp=$('#exFpos');if(fp&&pos)fp.textContent=pos.textContent;
  var pv=$('#exPrev'),nx=$('#exNext');
  if(pv)pv.disabled=(ex.i===0&&ex.b===0&&!ex.rev);
  if(nx)nx.disabled=(ex.i===EX.length-1&&ex.b>=bs.length-1);
  var te=bt.at&&bt.at.el?$(bt.at.el):null;if(te&&$('#panel').contains(te))te.classList.add('hit');
  exBarSync();
  plusGo(bt.at,bt.say);
}
function exNext(){
  var sc=EX[ex.i],nb=exBeats(sc).length;
  if(sc.k&&!ex.rev){if(ex.i<EX.length-1){ex.i++;ex.b=0;ex.rev=false;exShow();}return;}
  if(ex.b<nb-1){ex.b++;exBeat();return;}
  if(ex.i<EX.length-1){ex.i++;ex.b=0;ex.rev=false;exShow();}
}
function exPrev(){
  var sc=EX[ex.i];
  if(ex.b>0){ex.b--;exBeat();return;}
  if(sc.k&&ex.rev){ex.rev=false;ex.b=0;exShow();return;}
  if(ex.i>0){ex.i--;ex.b=0;ex.rev=false;exShow();}
}
function startExplain(i){
  st.mode='explain';st.over=false;st.gate=false;st.stage='explain';st.lw=null;
  ex.i=i||0;ex.b=0;ex.rev=false;ex.miss=0;
  exShow();
}

/* ---------- Grafik saldo per periode (tab Belajar): bunga tunggal linear vs bunga majemuk eksponensial ---------- */
var CH={M0:5000000,p:6,n:3};
function chartHtml(){
  return '<div class="chart"><h3>Grafik saldo per periode</h3>'
    +'<svg id="chartSvg" viewBox="0 0 460 290" role="img" aria-label="Grafik saldo bunga tunggal dan bunga majemuk per periode"></svg>'
    +'<div class="legend"><span class="lgT">● Bunga tunggal (linear)</span><span class="lgM">● Bunga majemuk (eksponensial)</span></div>'
    +'<div class="sl"><label for="slM">M₀</label><input type="range" id="slM" min="1000000" max="20000000" step="500000" aria-label="Modal awal"><output id="oM"></output></div>'
    +'<div class="sl"><label for="slP">i</label><input type="range" id="slP" min="0.5" max="15" step="0.5" aria-label="Suku bunga per periode"><output id="oP"></output></div>'
    +'<div class="sl"><label for="slN">n</label><input type="range" id="slN" min="1" max="30" step="1" aria-label="Banyak periode"><output id="oN"></output></div>'
    +'<div id="chartRead"></div></div>';
}
function bindChart(){
  var m=$('#slM'),p=$('#slP'),n=$('#slN');if(!m)return;
  m.value=CH.M0;p.value=CH.p;n.value=CH.n;
  m.oninput=function(){CH.M0=+m.value;drawChart();};
  p.oninput=function(){CH.p=+p.value;drawChart();};
  n.oninput=function(){CH.n=+n.value;drawChart();};
}
function drawChart(){
  var svg=$('#chartSvg');if(!svg)return;
  var M0=CH.M0,i=CH.p/100,n=CH.n,W=460,H=290,L=58,R=14,Tp=14,Bt=34,k;
  var TS=[],MS=[];for(k=0;k<=n;k++){TS.push(M0*(1+i*k));MS.push(M0*powi(1+i,k));}
  var hi=MS[n],lo=M0,step=niceStep((hi-lo)/4||M0/10);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;if(hi<=lo)hi=lo+step;
  var X=function(x){return L+(W-L-R)*x/n;},Y=function(v){return Tp+(H-Tp-Bt)*(1-(v-lo)/(hi-lo));};
  var s='';
  for(var v=lo;v<=hi+1;v+=step){s+='<line x1="'+L+'" y1="'+Y(v)+'" x2="'+(W-R)+'" y2="'+Y(v)+'" stroke="#e4ebf7"/><text class="ax" x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+fNum(v/1000000,2,true)+' jt</text>';}
  var tk=n<=12?1:n<=20?2:5;
  for(k=0;k<=n;k+=tk)s+='<text class="ax" x="'+X(k)+'" y="'+(H-Bt+16)+'" text-anchor="middle">'+k+'</text>';
  s+='<text class="ax" x="'+((W+L)/2)+'" y="'+(H-4)+'" text-anchor="middle">periode ke-</text>';
  s+='<line x1="'+L+'" y1="'+(H-Bt)+'" x2="'+(W-R)+'" y2="'+(H-Bt)+'" stroke="#94a3b8"/><line x1="'+L+'" y1="'+Tp+'" x2="'+L+'" y2="'+(H-Bt)+'" stroke="#94a3b8"/>';
  var line=function(arr,c){return '<polyline fill="none" stroke="'+c+'" stroke-width="3" points="'+arr.map(function(v,x){return X(x).toFixed(1)+','+Y(v).toFixed(1);}).join(' ')+'"/>';};
  s+=line(TS,'#1d4ed8')+line(MS,'#c2410c');
  if(n<=15)for(k=0;k<=n;k++){s+='<circle cx="'+X(k)+'" cy="'+Y(TS[k])+'" r="3.5" fill="#1d4ed8"/><circle cx="'+X(k)+'" cy="'+Y(MS[k])+'" r="3.5" fill="#c2410c"/>';}
  svg.innerHTML=s;
  $('#oM').textContent=fRp(M0);$('#oP').textContent=fPct(CH.p);$('#oN').textContent=n+' periode';
  var d=MS[n]-TS[n];
  $('#chartRead').innerHTML='<div class="dtwrap"><table class="dt"><tr><th>Setelah n = '+n+'</th><th>Mₙ</th><th>Bunga B</th></tr>'
    +'<tr><td>Bunga tunggal</td><td>'+fRp(TS[n])+'</td><td>'+fRp(TS[n]-M0)+'</td></tr>'
    +'<tr><td>Bunga majemuk</td><td>'+fRp(MS[n])+'</td><td>'+fRp(MS[n]-M0)+'</td></tr></table></div>'
    +'<p class="muted">'+(n===1?'Untuk n = 1 hasil keduanya <b>sama</b>.':'Bunga majemuk lebih besar <b>'+fRp(d)+'</b>.')+' Beda bunga tunggal per periode: '+fRp(M0*i)+' (barisan aritmetika); rasio bunga majemuk: '+fD(1+i)+' (barisan geometri).</p>';
}
function niceStep(x){var e=1;while(e*10<=x)e*=10;while(e>x)e/=10;var f=x/e;return (f<=1?1:f<=2?2:f<=5?5:10)*e;}

/* ---------- Plus berpindah dan menunjuk ---------- */
var plusAt=null,plusTf=null,plusTh=null;
function fxEnsure(){
  var f=$('#plusFx');if(f)return f;
  f=document.createElementNS('http://www.w3.org/2000/svg','svg');f.id='plusFx';f.setAttribute('aria-hidden','true');
  f.innerHTML='<defs><marker id="fxArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker></defs>'
    +'<rect class="ring" id="fxRing" x="0" y="0" width="0" height="0"/><path class="beam" id="fxBeam" d=""/>';
  document.body.appendChild(f);return f;
}
var MQ_SMALL=window.matchMedia?window.matchMedia('not all and (min-width:860px) and (min-height:500px)'):null;
function exBarH(){return parseFloat(document.documentElement.style.getPropertyValue('--exbar-h'))||0;}
function exBarSync(){
  var f=$('#exFloat'),onb=st.mode==='explain'&&!!MQ_SMALL&&MQ_SMALL.matches&&!!f;
  document.body.classList.toggle('ex-bar',onb);
  document.documentElement.style.setProperty('--exbar-h',(onb?f.offsetHeight:0)+'px');
}
var plusTouch=false;
document.addEventListener('touchstart',function(){plusTouch=true;},{passive:true});
['touchend','touchcancel'].forEach(function(nm){document.addEventListener(nm,function(){plusTouch=false;},{passive:true});});
function plusReveal(b){
  if(plusTouch)return;
  var m=12,vh=window.innerHeight-exBarH(),dy;
  if(b.top>=m&&b.bottom<=vh-m)return;
  dy=(b.height>vh-2*m||b.top<m)?b.top-m:b.bottom-(vh-m);
  if(dy)window.scrollBy(0,dy);
}
function plusRect(t,reveal){
  if(!t||!t.el)return null;
  var e=typeof t.el==='string'?$(t.el):t.el;if(!e)return null;
  var r0=e.getBoundingClientRect();
  if(!r0.width&&!r0.height)return null;
  if(reveal){plusReveal({top:r0.top,bottom:r0.bottom,height:r0.height});r0=e.getBoundingClientRect();}
  return {x:r0.left-4,y:r0.top-3,w:r0.width+8,h:r0.height+6,round:false};
}
function plusFxClear(){
  var rg=$('#fxRing'),bm=$('#fxBeam');
  if(rg){rg.setAttribute('width',0);rg.setAttribute('height',0);}
  if(bm)bm.setAttribute('d','');
}
function plusPlace(reveal){
  var a=plusAt;if(!a)return;
  fxEnsure();
  var r=plusRect(a.t,reveal);
  if(!r){plusFxClear();return;}
  var rg=$('#fxRing'),bm=$('#fxBeam');
  rg.setAttribute('x',r.x);rg.setAttribute('y',r.y);rg.setAttribute('width',r.w);rg.setAttribute('height',r.h);rg.setAttribute('rx',r.round?r.w/2:10);
  bm.setAttribute('d','');
  var w=$('#plusWrap');
  if(!w||document.body.classList.contains('plus-off'))return;
  var vw=document.documentElement.clientWidth,vh=window.innerHeight-exBarH();
  var bw=$('#plusBody').offsetWidth,bh=$('#plusBody').offsetHeight,ww=w.offsetWidth,wh=w.offsetHeight;
  var hx=vw-8-ww,hy=vh-8-wh,m=16,tcx=r.x+r.w/2,tcy=r.y+r.h/2;
  var yMid=tcy-(wh-bh/2);
  var right={side:'r',X:r.x+r.w+m,Y:yMid},left={side:'l',X:r.x-m-ww,Y:yMid};
  var vc=function(side,Y){var X=side==='r'?tcx-bw/2:tcx-(ww-bw/2);X=Math.min(Math.max(4,X),vw-4-ww);return {side:side,X:X,Y:Y,cx:X+(side==='r'?bw/2:ww-bw/2)};};
  var vb=[vc('r',r.y+r.h+m),vc('l',r.y+r.h+m)],va=[vc('r',r.y-m-wh),vc('l',r.y-m-wh)];
  var byC=function(p,q){return Math.abs(p.cx-tcx)-Math.abs(q.cx-tcx);};vb.sort(byC);va.sort(byC);
  var cs=(tcx>vw/2?[left,right]:[right,left]).concat(tcy>vh/2?va.concat(vb):vb.concat(va));
  var fits=function(c){return c.X>=4&&c.Y>=4&&c.X+ww<=vw-4&&c.Y+wh<=vh-4;};
  var ex0=r.x-4,ey0=r.y-4,ew=r.w+8,eh=r.h+8;
  var clash=function(c){return !(c.X+ww<=ex0||c.X>=ex0+ew||c.Y+wh<=ey0||c.Y>=ey0+eh);};
  var pk=null,i;
  for(i=0;i<cs.length;i++)if(fits(cs[i])&&!clash(cs[i])){pk=cs[i];break;}
  if(!pk)for(i=0;i<cs.length;i++)if(fits(cs[i])){pk=cs[i];break;}
  if(!pk){pk={side:cs[0].side,X:Math.min(Math.max(4,cs[0].X),vw-4-ww),Y:Math.min(Math.max(4,cs[0].Y),vh-4-wh)};}
  w.setAttribute('data-side',pk.side);w.classList.add('go');
  w.style.transform='translate('+Math.round(pk.X-hx)+'px,'+Math.round(pk.Y-hy)+'px)';
  var S2={x:pk.X+(pk.side==='r'?bw/2:ww-bw/2),y:pk.Y+wh-bh/2},C={x:tcx,y:tcy};
  clearTimeout(plusTf);
  plusTf=setTimeout(function(){
    if(!plusAt)return;
    var dx=C.x-S2.x,dy=C.y-S2.y,L=Math.sqrt(dx*dx+dy*dy)||1,ux=dx/L,uy=dy/L;
    var t1=Math.min((r.w/2+6)/(Math.abs(ux)||1e-6),(r.h/2+6)/(Math.abs(uy)||1e-6));
    var s0=bw*.42;if(L<=s0+t1+8){bm.setAttribute('d','');return;}
    bm.setAttribute('d','M'+(S2.x+ux*s0)+' '+(S2.y+uy*s0)+' L'+(C.x-ux*t1)+' '+(C.y-uy*t1));
  },plusReduced()?0:680);
}
function plusGo(t,text,auto){
  plusAt={t:t};clearTimeout(plusTh);
  if(text){var b=$('#plusBubble');if(b){b.textContent=text;b.classList.add('show');clearTimeout(plusTb);}}
  plusPlace(true);
  if(!document.body.classList.contains('plus-off'))plusState('normal','point',1900);
  if(auto)plusTh=setTimeout(plusHome,auto);
}
function plusHome(){
  plusAt=null;clearTimeout(plusTf);clearTimeout(plusTh);
  var w=$('#plusWrap');if(w){w.style.transform='';w.removeAttribute('data-side');}
  plusFxClear();
  var b=$('#plusBubble');if(b)b.classList.remove('show');
}
var plusRaf=0;
function plusRefresh(){if(!plusAt||plusRaf)return;plusRaf=requestAnimationFrame(function(){plusRaf=0;plusPlace();});}
window.addEventListener('resize',exBarSync);
window.addEventListener('resize',plusRefresh);
if(MQ_SMALL&&MQ_SMALL.addEventListener)MQ_SMALL.addEventListener('change',function(){exBarSync();plusRefresh();});
window.addEventListener('scroll',plusRefresh,{passive:true});
$('#panel').addEventListener('scroll',plusRefresh,{passive:true});
$('#side').addEventListener('scroll',plusRefresh,{passive:true});
document.addEventListener('keydown',function(e){
  if(st.mode!=='explain')return;
  var tg=e.target&&e.target.tagName;
  if(e.key==='Escape'){plusHome();return;}
  if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
  if(e.key==='ArrowRight')exNext();else if(e.key==='ArrowLeft')exPrev();
});

/* ---------- Rumus: render LaTeX (KaTeX) dengan teks biasa sebagai cadangan ----------
   Setiap rumus ditulis <… data-tex="LATEX">TEKS</…>. Bila KaTeX (JS dan CSS) belum/tidak termuat,
   teks biasa tetap tampil. Perenderan dilakukan ke elemen sementara lalu ditukar. */
var MATH_FB=(typeof WeakMap==='function')?new WeakMap():null;
var MATH_OPT={throwOnError:false,displayMode:false,output:'htmlAndMathml',strict:'ignore',trust:false};
var MATH_CSS_OK=false;
function mathCss(){
  var l=document.getElementById('katexCss'),okc=MATH_CSS_OK;
  if(!l||!l.sheet)return false;
  try{okc=l.sheet.cssRules.length>0;}catch(e){}
  if(!okc)return false;
  if(l.media!=='all')l.media='all';
  return true;
}
function mathReady(){return !!(MATH_FB&&window.katex&&typeof window.katex.render==='function'&&mathCss());}
function renderMath(root){
  if(!root||!mathReady())return 0;
  var list=[].slice.call(root.querySelectorAll?root.querySelectorAll('[data-tex]'):[]);
  if(root.nodeType===1&&root.hasAttribute('data-tex'))list.unshift(root);
  var c=0;
  list.forEach(function(el){
    if(el.querySelector('.katex'))return;
    var tex=el.getAttribute('data-tex'),tmp;
    try{
      tmp=document.createElement('span');
      window.katex.render(tex,tmp,MATH_OPT);
      if(!tmp.querySelector('.katex')||tmp.querySelector('.katex-error'))return;
    }catch(e){return;}
    MATH_FB.set(el,el.innerHTML);
    el.innerHTML='';
    while(tmp.firstChild)el.appendChild(tmp.firstChild);
    c++;
  });
  if(c){plusRefresh();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(plusRefresh);}
  return c;
}
function mathBoot(){if(mathReady())renderMath(document);}
['katexJs','katexCss'].forEach(function(id){var e=document.getElementById(id);if(e)e.addEventListener('load',function(){if(id==='katexCss')MATH_CSS_OK=true;mathBoot();});});
window.addEventListener('load',mathBoot);
if(document.fonts&&document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',plusRefresh);

window.__api={EX:EX,CORE:CORE,parseIn:parseIn,startExplain:startExplain,startLearn:startLearn,startPractice:startPractice,plusGo:plusGo,plusHome:plusHome};
startExplain();
})();
